<!--
  CHUCKLES & CHAI - horizontal lockup
  ===========================================================================
  For letterheads, email footers, cup sleeves and anywhere the circular seal
  is too tall. Derived from assets/logo-seal.svg - if the café has the
  original artwork, replace both files with it.

  The wordmark is live text so it stays crisp and selectable. Embed Fraunces
  and Inter, or outline the text, before sending this to a printer.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 90" width="400" height="90"
     role="img" aria-labelledby="logo-title">
  <title id="logo-title">Chuckles &amp; Chai — Awaken With Aroma</title>

  <!-- Mark: ring, steam, glass -->
  <g transform="translate(45 45)">
    <circle r="31" fill="none" stroke="#6E1F2E" stroke-width="2.2"/>
    <circle r="26" fill="none" stroke="#6E1F2E" stroke-width="1" opacity=".45"/>
    <g fill="none" stroke="#6E1F2E" stroke-width="2.6" stroke-linecap="round">
      <path d="M-6 -14c-1.5 2 1.5 3.2 0 5.2"/>
      <path d="M0 -15.4c-1.5 2 1.5 3.2 0 5.2"/>
      <path d="M6 -14c-1.5 2 1.5 3.2 0 5.2"/>
    </g>
    <path d="M-11 -3.4h22l-2.6 15.4a4.2 4.2 0 0 1-4.1 3.5h-8.6a4.2 4.2 0 0 1-4.1-3.5Z"
          fill="none" stroke="#6E1F2E" stroke-width="2.6" stroke-linejoin="round"/>
  </g>

  <!-- Wordmark -->
  <text x="94" y="47"
        font-family="Fraunces, 'Iowan Old Style', Georgia, serif"
        font-size="32" font-weight="600" letter-spacing="-.4" fill="#241318">Chuckles &amp; Chai</text>
  <text x="96" y="66"
        font-family="Inter, 'Segoe UI', Arial, sans-serif"
        font-size="9.5" font-weight="600" letter-spacing="4.2" fill="#8A5410">AWAKEN WITH AROMA</text>

  <!-- Rule + established -->
  <line x1="96" y1="73.5" x2="330" y2="73.5" stroke="#241318" stroke-opacity=".16" stroke-width="1"/>
  <text x="330" y="66" text-anchor="end"
        font-family="Inter, 'Segoe UI', Arial, sans-serif"
        font-size="9.5" font-weight="600" letter-spacing="3.4" fill="#6E1F2E">EST 2025</text>
</svg>
